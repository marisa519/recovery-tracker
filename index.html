<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Recovery Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f8f9fa;--border:#e0e0e0;--accent:#4a90d9;--green:#34a853;--red:#ea4335;--orange:#fbbc04;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);max-width:600px;margin:0 auto;padding-bottom:70px;}
.header{position:sticky;top:0;z-index:50;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:1.1rem;}
.sync-dot{width:10px;height:10px;border-radius:50%;background:#ccc;display:inline-block;margin-left:8px;}
.sync-dot.connected{background:var(--green);}.sync-dot.error{background:var(--orange);}
.tabs{display:flex;gap:4px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:.85rem;cursor:pointer;white-space:nowrap;color:var(--fg);}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.panel{display:none;padding:12px 16px;}.panel.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.card h3{font-size:.95rem;margin-bottom:10px;}
.field{display:flex;flex-direction:column;gap:2px;}
.field label{font-size:.75rem;color:#666;font-weight:600;}
.field input,.field select{height:42px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font-size:.95rem;background:var(--bg);color:var(--fg);width:100%;-webkit-appearance:none;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.row>.field{flex:1 1 calc(50% - 4px);min-width:120px;}
.bp-readings-row{display:flex;gap:8px;margin-top:8px;}
.bp-readings-row .field{flex:1 1 0%;min-width:0;}
.bp-readings-row input{width:100%;min-width:0;padding:0 6px;font-size:14px;}
.btn{height:42px;padding:0 18px;border:none;border-radius:6px;font-size:.9rem;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;}
.btn-primary{background:var(--accent);color:#fff;}.btn-secondary{background:var(--card);color:var(--fg);border:1px solid var(--border);}
.ws-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:nowrap;}
.ws-row label{font-size:.75rem;color:#666;font-weight:600;white-space:nowrap;min-width:45px;}
.ws-row input{height:42px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font-size:.95rem;flex:1;min-width:0;-webkit-appearance:none;}
.ws-row .btn{white-space:nowrap;flex-shrink:0;}
.multi-select{position:relative;}
.multi-select-display{height:42px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font-size:.95rem;display:flex;align-items:center;cursor:pointer;background:var(--bg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.multi-select-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1px solid var(--border);border-radius:6px;z-index:200;max-height:200px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.multi-select-dropdown.open{display:block;}
.multi-select-dropdown label{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-size:.9rem;}
.multi-select-dropdown input[type="checkbox"]{width:18px;height:18px;}
.daily-totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.daily-totals .stat{text-align:center;padding:10px;background:var(--card);border-radius:8px;border:1px solid var(--border);}
.daily-totals .stat .val{font-size:1.2rem;font-weight:700;}.daily-totals .stat .lbl{font-size:.7rem;color:#666;}
.chart-container{position:relative;height:280px;margin-bottom:12px;}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.week-nav button{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg);border-radius:12px;padding:20px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto;}
.modal h3{margin-bottom:12px;}.modal .field{margin-bottom:10px;}
.export-table{width:100%;border-collapse:collapse;font-size:.85rem;}
.export-table th,.export-table td{border:1px solid var(--border);padding:8px;text-align:center;}
.export-table th{background:var(--card);}
@media(max-width:600px){
.bp-readings-row{display:flex !important;flex-wrap:nowrap !important;gap:6px !important;margin-top:8px;}
.bp-readings-row .field{flex:1 1 0% !important;min-width:0 !important;}
.bp-readings-row input{width:100% !important;min-width:0 !important;padding:0 6px !important;font-size:14px !important;}
.bp-readings-row label{font-size:.65rem !important;}
input[type="time"],input[type="date"]{font-size:14px !important;min-height:42px !important;max-height:42px !important;line-height:42px !important;padding:0 10px !important;box-sizing:border-box !important;-webkit-appearance:none !important;}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg);border-top:1px solid var(--border);padding:6px 8px;margin:0;justify-content:space-around;gap:2px;flex-wrap:nowrap;}
.tab{flex:1;text-align:center;padding:10px 4px;font-size:.7rem;border-radius:6px;border:none;background:transparent;}
.row>.field{flex:1 1 calc(50% - 4px);min-width:70px;}
.daily-totals{grid-template-columns:repeat(2,1fr);}
.chart-container{height:220px;}
.multi-select-dropdown{position:fixed;left:10px;right:10px;top:auto;bottom:70px;max-height:50vh;overflow-y:auto;}
}
</style></head><body>
<div class="header">
  <div style="display:flex;align-items:center;"><h1>Recovery Tracker</h1><span class="sync-dot" id="syncDot"></span></div>
  <button class="btn btn-secondary" style="font-size:.8rem;height:34px;padding:0 10px;" onclick="document.getElementById('settingsModal').classList.add('open')">⚙ Backup</button>
</div>
<div class="tabs" id="tabBar">
  <button class="tab active" data-tab="log">Log</button>
  <button class="tab" data-tab="weekly">Weekly</button>
  <button class="tab" data-tab="charts">Charts</button>
  <button class="tab" data-tab="analysis">Analysis</button>
  <button class="tab" data-tab="export">Export</button>
</div>
<div id="panel-log" class="panel active">
  <div class="card">
    <h3>Blood Pressure &amp; Medications</h3>
    <div class="row"><div class="field"><label>Time</label><input type="time" id="bpTime"></div></div>
    <div class="bp-readings-row">
      <div class="field"><label>Systolic</label><input type="number" id="bpSys" placeholder="120" inputmode="numeric"></div>
      <div class="field"><label>Diastolic</label><input type="number" id="bpDia" placeholder="80" inputmode="numeric"></div>
      <div class="field"><label>Pulse</label><input type="number" id="bpPulse" placeholder="72" inputmode="numeric"></div>
    </div>
    <div class="row" style="margin-top:8px;">
      <div class="field"><label>Symptoms</label>
        <div class="multi-select">
          <div class="multi-select-display" id="symptomDisplay" onclick="toggleDropdown('symptomDD')">Select...</div>
          <div class="multi-select-dropdown" id="symptomDD">
            <label><input type="checkbox" name="symptom" value="Headache" onchange="updateDisplay('symptom','symptomDisplay')"> Headache</label>
            <label><input type="checkbox" name="symptom" value="Numbness" onchange="updateDisplay('symptom','symptomDisplay')"> Numbness</label>
            <label><input type="checkbox" name="symptom" value="Fatigue" onchange="updateDisplay('symptom','symptomDisplay')"> Fatigue</label>
            <label><input type="checkbox" name="symptom" value="Nausea" onchange="updateDisplay('symptom','symptomDisplay')"> Nausea</label>
          </div>
        </div>
      </div>
      <div class="field"><label>Medications</label>
        <div class="multi-select">
          <div class="multi-select-display" id="medDisplay" onclick="toggleDropdown('medDD')">Select...</div>
          <div class="multi-select-dropdown" id="medDD">
            <label><input type="checkbox" name="med" value="Florinef" onchange="updateDisplay('med','medDisplay')"> Florinef</label>
            <label><input type="checkbox" name="med" value="Midodrine" onchange="updateDisplay('med','medDisplay')"> Midodrine</label>
            <label><input type="checkbox" name="med" value="Aspirin" onchange="updateDisplay('med','medDisplay')"> Aspirin</label>
            <label><input type="checkbox" name="med" value="Tylenol" onchange="updateDisplay('med','medDisplay')"> Tylenol</label>
            <label><input type="checkbox" name="med" value="Lipitor" onchange="updateDisplay('med','medDisplay')"> Lipitor</label>
            <label><input type="checkbox" name="med" value="Skipped" onchange="updateDisplay('med','medDisplay')"> Skipped</label>
          </div>
        </div>
      </div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="logEntry()">Log Entry</button>
  </div>
  <div class="card">
    <h3>Water &amp; Steps</h3>
    <div class="ws-row"><label>Water</label><input type="number" id="waterAmt" placeholder="oz" inputmode="numeric"><button class="btn btn-primary" onclick="logWater()">+ Add</button></div>
    <div class="ws-row"><label>Steps</label><input type="number" id="stepsAmt" placeholder="steps" inputmode="numeric"><button class="btn btn-primary" onclick="logSteps()">+ Add</button></div>
    <div style="display:flex;gap:12px;margin-top:4px;font-size:.85rem;color:#666;">
      <span>💧 Today: <b id="waterTotal">0 oz</b></span><span>👟 Today: <b id="stepsTotal">0</b></span>
    </div>
    <div style="margin-top:8px;"><label style="font-size:.75rem;color:#666;cursor:pointer;">🍎 <input type="file" id="appleFile" accept=".zip,.xml" style="display:none;" onchange="importAppleHealth(this)">Import Apple Health</label></div>
  </div>
  <div class="card"><h3>Today's Log</h3><div id="entryList"><p style="color:#999;text-align:center;">No entries yet today</p></div></div>
</div>
<div id="panel-weekly" class="panel"><div class="week-nav"><button onclick="changeWeek(-1)">◀</button><span id="weekLabel"></span><button onclick="changeWeek(1)">▶</button></div><div id="weeklyContent"></div></div>
<div id="panel-charts" class="panel"><div class="card"><h3>BP Trend (30 days)</h3><div class="chart-container"><canvas id="bpChart"></canvas></div></div><div class="card"><h3>Water &amp; Steps</h3><div class="chart-container"><canvas id="wsChart"></canvas></div></div></div>
<div id="panel-analysis" class="panel"><div class="card"><h3>BP Analysis</h3><div class="row"><div class="field"><label>From</label><input type="date" id="aFrom"></div><div class="field"><label>To</label><input type="date" id="aTo"></div></div><button class="btn btn-primary" onclick="runAnalysis()">Analyze</button><div id="analysisResult" style="margin-top:12px;"></div></div></div>
<div id="panel-export" class="panel"><div class="card"><h3>BP Log Export</h3><div class="row"><div class="field"><label>From</label><input type="date" id="eFrom"></div><div class="field"><label>To</label><input type="date" id="eTo"></div></div><button class="btn btn-primary" onclick="renderExport()" style="margin-bottom:8px;">Generate</button>
  <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-secondary" onclick="downloadCSV()">Download CSV</button><button class="btn btn-secondary" onclick="screenshotExport()">📸 Screenshot View</button><button class="btn btn-secondary" onclick="copyPlainText()">📋 Copy as Text</button></div>
  <div id="exportTable" style="margin-top:12px;overflow-x:auto;"></div></div></div>
<div class="modal-overlay" id="settingsModal"><div class="modal">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h3>Data &amp; Backup</h3><button onclick="document.getElementById('settingsModal').classList.remove('open')" style="background:none;border:none;font-size:1.2rem;cursor:pointer;">✕</button></div>
  <div class="card"><h3>Manual Backup</h3><button class="btn btn-secondary" onclick="showStorageDiag()" style="width:100%;margin-bottom:8px;font-size:.8rem;">🔍 Show All Stored Data</button><div id="diagOutput" style="display:none;margin-bottom:8px;padding:8px;background:#f0f0f0;border-radius:6px;font-size:.75rem;max-height:200px;overflow-y:auto;word-break:break-all;"></div><button class="btn btn-primary" onclick="downloadBackup()" style="width:100%;margin-bottom:8px;">Download Backup</button><label class="btn btn-secondary" style="width:100%;cursor:pointer;text-align:center;"><input type="file" accept=".json" style="display:none;" onchange="restoreBackup(this)">Restore from File</label></div>
  <div class="card"><h3>Firebase Cloud Sync</h3>
    <div class="field" style="margin-bottom:8px;"><label>API Key</label><input id="fbKey" placeholder="AIza..."></div>
    <div class="field" style="margin-bottom:8px;"><label>Database URL</label><input id="fbUrl" placeholder="https://...firebaseio.com"></div>
    <div class="field" style="margin-bottom:8px;"><label>Project ID</label><input id="fbProj" placeholder="my-project-id"></div>
    <div class="field" style="margin-bottom:8px;"><label>Sync Password</label><input id="fbPass" type="password" placeholder="your passphrase"></div>
    <button class="btn btn-primary" onclick="connectFirebase()" style="width:100%;">Connect &amp; Sync</button>
  </div>
</div></div><script>
function showTab(name,el){
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  var panel=document.getElementById('panel-'+name);
  if(panel)panel.classList.add('active');
  if(el)el.classList.add('active');
  try{if(name==='weekly')renderWeekly();if(name==='charts')renderCharts();if(name==='log'){refreshLog();setCurrentTime();}}catch(e){}
}
document.getElementById('tabBar').addEventListener('click',function(e){
  var btn=e.target.closest('[data-tab]');if(btn)showTab(btn.getAttribute('data-tab'),btn);
});
</script><script>
var STORE_KEY='recovery_tracker_data';
var DATA={bp:[],water:[],steps:[],appleSteps:{}};
function loadData(){try{var d=localStorage.getItem(STORE_KEY);if(d)DATA=JSON.parse(d);}catch(e){}}
function saveData(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DATA));syncToFirebase();}catch(e){}}
try{loadData();}catch(e){}
try{var oldKeys=['recoveryData','recovery_data','recoveryTrackerData','RecoveryTracker','recovery-tracker','health_tracker','healthTracker'];
oldKeys.forEach(function(k){try{var d=localStorage.getItem(k);if(d){var p=JSON.parse(d);if(p.bp&&p.bp.length){
p.bp.forEach(function(e){var dup=DATA.bp.some(function(x){return x.date===e.date&&x.time===e.time&&x.sys===e.sys;});if(!dup)DATA.bp.push(e);});
(p.water||[]).forEach(function(e){DATA.water.push(e);});(p.steps||[]).forEach(function(e){DATA.steps.push(e);});
if(p.appleSteps){for(var k2 in p.appleSteps){DATA.appleSteps[k2]=p.appleSteps[k2];}}
saveData();localStorage.removeItem(k);}}}catch(e){}});
for(var i=0;i<localStorage.length;i++){try{var key=localStorage.key(i);if(key===STORE_KEY)continue;
var val=localStorage.getItem(key);if(val&&val.indexOf('"bp"')>-1){var p=JSON.parse(val);
if(p&&p.bp&&Array.isArray(p.bp)&&p.bp.length){p.bp.forEach(function(e){
var dup=DATA.bp.some(function(x){return x.date===e.date&&x.time===e.time&&x.sys===e.sys;});if(!dup)DATA.bp.push(e);});
saveData();}}}catch(e){}}
}catch(e){}

var fbDb=null,fbRef=null;
function syncToFirebase(){try{if(fbDb&&fbRef){fbDb.ref(fbRef).set(DATA);}}catch(e){}}
function syncFromFirebase(){try{if(fbDb&&fbRef){fbDb.ref(fbRef).on('value',function(snap){
var d=snap.val();if(d){DATA=d;if(!DATA.bp)DATA.bp=[];if(!DATA.water)DATA.water=[];if(!DATA.steps)DATA.steps=[];if(!DATA.appleSteps)DATA.appleSteps={};
saveData();refreshLog();updateTotals();}});}}catch(e){}}
function connectFirebase(){try{
var key=document.getElementById('fbKey').value;var url=document.getElementById('fbUrl').value;
var proj=document.getElementById('fbProj').value;var pass=document.getElementById('fbPass').value;
if(!key||!url||!proj||!pass){alert('Fill all fields');return;}
localStorage.setItem('fb_config',JSON.stringify({key:key,url:url,proj:proj,pass:pass}));
loadFirebase(key,url,proj,pass);document.getElementById('settingsModal').classList.remove('open');
}catch(e){alert('Error: '+e.message);}}
function loadFirebase(key,url,proj,pass){
var s1=document.createElement('script');s1.src='https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js';
s1.onload=function(){var s2=document.createElement('script');s2.src='https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js';
s2.onload=function(){try{if(!firebase.apps.length)firebase.initializeApp({apiKey:key,databaseURL:url,projectId:proj});
fbDb=firebase.database();var h=0;for(var i=0;i<pass.length;i++){h=((h<<5)-h)+pass.charCodeAt(i);h|=0;}
fbRef='users/'+Math.abs(h)+'/data';syncFromFirebase();
document.getElementById('syncDot').classList.add('connected');
}catch(e){document.getElementById('syncDot').classList.add('error');}};document.head.appendChild(s2);};document.head.appendChild(s1);}
try{var fc=localStorage.getItem('fb_config');if(fc){var c=JSON.parse(fc);loadFirebase(c.key,c.url,c.proj,c.pass);}}catch(e){}

function toggleDropdown(id){var dd=document.getElementById(id);if(dd)dd.classList.toggle('open');}
document.addEventListener('click',function(e){if(!e.target.closest('.multi-select')){
document.querySelectorAll('.multi-select-dropdown').forEach(function(d){d.classList.remove('open');});}});
function getChecked(name){var boxes=document.querySelectorAll('input[name="'+name+'"]:checked');var v=[];boxes.forEach(function(b){v.push(b.value);});return v;}
function updateDisplay(name,did){var v=getChecked(name);var el=document.getElementById(did);if(el)el.textContent=v.length?v.join(', '):'Select...';}

function setCurrentTime(){var n=new Date();var el=document.getElementById('bpTime');if(el)el.value=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
function bpColor(sys,dia){if(sys>=110&&sys<=140&&dia>=70&&dia<=90)return 'var(--green)';if(sys>=140||dia>=90)return 'var(--red)';return 'var(--orange)';}

function logEntry(){
var t=document.getElementById('bpTime');var s=document.getElementById('bpSys');var d=document.getElementById('bpDia');var p=document.getElementById('bpPulse');
var tv=t?t.value:'';var sv=s?parseInt(s.value):0;var dv=d?parseInt(d.value):0;var pv=p?parseInt(p.value):0;
var symptoms=getChecked('symptom');var meds=getChecked('med');
if(sv&&dv){var today=new Date().toISOString().slice(0,10);
DATA.bp.push({date:today,time:tv,sys:sv,dia:dv,pulse:pv,symptoms:symptoms,meds:meds});
saveData();if(s)s.value='';if(d)d.value='';if(p)p.value='';
document.querySelectorAll('input[name="symptom"],input[name="med"]').forEach(function(c){c.checked=false;});
updateDisplay('symptom','symptomDisplay');updateDisplay('med','medDisplay');
setCurrentTime();refreshLog();updateTotals();}}

function addWater(v){var today=new Date().toISOString().slice(0,10);DATA.water.push({date:today,time:new Date().toTimeString().slice(0,5),oz:v});saveData();updateTotals();}
function addSteps(v){var today=new Date().toISOString().slice(0,10);DATA.steps.push({date:today,time:new Date().toTimeString().slice(0,5),count:v});saveData();updateTotals();}
function logWater(){var el=document.getElementById('waterAmt');var v=el?parseInt(el.value):0;if(v>0){addWater(v);el.value='';}}
function logSteps(){var el=document.getElementById('stepsAmt');var v=el?parseInt(el.value):0;if(v>0){addSteps(v);el.value='';}}

function refreshLog(){try{
var el=document.getElementById('entryList');if(!el)return;
var today=new Date().toISOString().slice(0,10);
var entries=[];DATA.bp.forEach(function(e,i){if(e.date===today)entries.push({entry:e,idx:i});});
if(!entries.length){el.innerHTML='<p style="color:#999;text-align:center;">No entries yet today</p>';return;}
entries.sort(function(a,b){return a.entry.time>b.entry.time?1:-1;});
var h='';entries.forEach(function(item){var e=item.entry;var i=item.idx;var c=bpColor(e.sys,e.dia);
h+='<div style="padding:8px;border-bottom:1px solid var(--border);">';
h+='<div style="display:flex;justify-content:space-between;align-items:center;">';
h+='<span style="font-size:.85rem;color:#666;">'+e.time+'</span>';
h+='<span style="font-weight:700;color:'+c+';">'+e.sys+'/'+e.dia+'</span>';
h+='<span style="font-size:.85rem;">'+(e.pulse||'-')+' bpm</span>';
h+='<span style="display:flex;gap:4px;">';
h+='<button onclick="editBP('+i+')" style="background:none;border:none;cursor:pointer;font-size:.85rem;padding:2px 6px;">✏️</button>';
h+='<button onclick="deleteBP('+i+')" style="background:none;border:none;cursor:pointer;font-size:.85rem;padding:2px 6px;">🗑️</button>';
h+='</span></div>';

if(f.name.endsWith('.zip')){var r=new FileReader();r.onload=function(){alert('ZIP import requires JSZip library. Please export as XML instead, or upload the export.xml file from inside the ZIP.');};r.readAsArrayBuffer(f);}
else{var r=new FileReader();r.onload=function(){var xml=r.result;var parser=new DOMParser();var doc=parser.parseFromString(xml,'text/xml');
var records=doc.querySelectorAll('Record[type="HKQuantityTypeIdentifierStepCount"]');
var imported=0;records.forEach(function(rec){var d=rec.getAttribute('startDate');if(d){var day=d.slice(0,10);
var v=parseFloat(rec.getAttribute('value'))||0;if(!DATA.appleSteps)DATA.appleSteps={};
if(!DATA.appleSteps[day])DATA.appleSteps[day]=0;DATA.appleSteps[day]+=Math.round(v);imported++;}});
saveData();updateTotals();alert('Imported '+imported+' step records');};r.readAsText(f);}}catch(e){alert('Error: '+e.message);}}

var weekOffset=0;

function renderWeekly(){try{

var day=now.getDay();var mon=new Date(now);mon.setDate(mon.getDate()-((day+6)%7));
var sun=new Date(mon);sun.setDate(sun.getDate()+6);
var lbl=document.getElementById('weekLabel');
if(lbl)lbl.textContent=mon.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' - '+sun.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
var html='';var totSys=0,totDia=0,bpN=0,totW=0,totS=0;
for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(d.getDate()+i);var ds=d.toISOString().slice(0,10);
var dayBP=DATA.bp.filter(function(e){return e.date===ds;});
var dayW=0;(DATA.water||[]).forEach(function(e){if(e.date===ds)dayW+=e.oz;});
var dayS=0;(DATA.steps||[]).forEach(function(e){if(e.date===ds)dayS+=e.count;});dayS+=(DATA.appleSteps&&DATA.appleSteps[ds])||0;
totW+=dayW;totS+=dayS;
html+='<div class="card"><h3>'+d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</h3>';
if(dayBP.length){dayBP.sort(function(a,b){return a.time>b.time?1:-1;});dayBP.forEach(function(e){
var c=bpColor(e.sys,e.dia);totSys+=e.sys;totDia+=e.dia;bpN++;
h2='<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">';
h2+='<span style="font-size:.85rem;color:#666;">'+e.time+'</span>';
h2+='<span style="font-weight:700;color:'+c+';">'+e.sys+'/'+e.dia+'</span>';
h2+='<span style="font-size:.85rem;">'+(e.pulse||'-')+' bpm</span></div>';
if(e.meds&&e.meds.length)h2+='<div style="font-size:.75rem;color:#666;">💊 '+e.meds.join(', ')+'</div>';
if(e.symptoms&&e.symptoms.length)h2+='<div style="font-size:.75rem;color:#666;">🤒 '+e.symptoms.join(', ')+'</div>';
html+=h2;});}
else html+='<p style="color:#999;font-size:.85rem;">No readings</p>';
html+='<div style="font-size:.8rem;color:#666;margin-top:4px;">💧 '+dayW+' oz | 👟 '+dayS.toLocaleString()+'</div></div>';}
var summary='<div class="daily-totals"><div class="stat"><div class="val">'+(bpN?Math.round(totSys/bpN)+'/'+Math.round(totDia/bpN):'-')+'</div><div class="lbl">Avg BP</div></div>';
summary+='<div class="stat"><div class="val">'+bpN+'</div><div class="lbl">Readings</div></div>';
summary+='<div class="stat"><div class="val">'+Math.round(totW/7)+'</div><div class="lbl">Avg Water/Day (oz)</div></div>';
summary+='<div class="stat"><div class="val">'+Math.round(totS/7).toLocaleString()+'</div><div class="lbl">Avg Steps/Day</div></div></div>';
var el=document.getElementById('weeklyContent');if(el)el.innerHTML=summary+html;
}catch(e){}}

var bpChartInst=null,wsChartInst=null;
function renderCharts(){try{
var days=[];var now=new Date();for(var i=29;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10));}
var sysData=[],diaData=[],pulseData=[],waterData=[],stepsData=[],labels=[];
days.forEach(function(ds){labels.push(ds.slice(5));
var dayBP=DATA.bp.filter(function(e){return e.date===ds;});
if(dayBP.length){var s=0,d=0,p=0;dayBP.forEach(function(e){s+=e.sys;d+=e.dia;p+=e.pulse||0;});
sysData.push(Math.round(s/dayBP.length));diaData.push(Math.round(d/dayBP.length));pulseData.push(Math.round(p/dayBP.length));}
else{sysData.push(null);diaData.push(null);pulseData.push(null);}
var w=0;(DATA.water||[]).forEach(function(e){if(e.date===ds)w+=e.oz;});waterData.push(w);
var st=0;(DATA.steps||[]).forEach(function(e){if(e.date===ds)st+=e.count;});st+=(DATA.appleSteps&&DATA.appleSteps[ds])||0;stepsData.push(st);});
if(bpChartInst)bpChartInst.destroy();
var ctx1=document.getElementById('bpChart');if(ctx1){bpChartInst=new Chart(ctx1,{type:'line',data:{labels:labels,datasets:[
{label:'Systolic',data:sysData,borderColor:'#ea4335',tension:.3,spanGaps:true},
{label:'Diastolic',data:diaData,borderColor:'#4a90d9',tension:.3,spanGaps:true},
{label:'Pulse',data:pulseData,borderColor:'#34a853',tension:.3,spanGaps:true}]},
options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});}
if(wsChartInst)wsChartInst.destroy();
var ctx2=document.getElementById('wsChart');if(ctx2){wsChartInst=new Chart(ctx2,{type:'bar',data:{labels:labels,datasets:[
{label:'Water (oz)',data:waterData,backgroundColor:'#4a90d9',yAxisID:'y'},
{label:'Steps',data:stepsData,backgroundColor:'#34a853',yAxisID:'y1'}]},
options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},
scales:{y:{position:'left',title:{display:true,text:'oz'}},y1:{position:'right',title:{display:true,text:'Steps'},grid:{drawOnChartArea:false}}}}});}
}catch(e){}}

function runAnalysis(){try{
var from=document.getElementById('aFrom').value;var to=document.getElementById('aTo').value;
if(!from||!to){alert('Select date range');return;}
var entries=DATA.bp.filter(function(e){return e.date>=from&&e.date<=to;});
if(!entries.length){document.getElementById('analysisResult').innerHTML='<p>No data in range</p>';return;}
var minS=999,maxS=0,minD=999,maxD=0,totS=0,totD=0;
entries.forEach(function(e){if(e.sys<minS)minS=e.sys;if(e.sys>maxS)maxS=e.sys;if(e.dia<minD)minD=e.dia;if(e.dia>maxD)maxD=e.dia;totS+=e.sys;totD+=e.dia;});
var h='<div class="card" style="margin-top:8px;"><h3>Results ('+entries.length+' readings)</h3>';
h+='<table style="width:100%;font-size:.85rem;"><tr><th></th><th>Systolic</th><th>Diastolic</th></tr>';
h+='<tr><td>Highest</td><td style="color:var(--red);font-weight:700;">'+maxS+'</td><td style="color:var(--red);font-weight:700;">'+maxD+'</td></tr>';
h+='<tr><td>Lowest</td><td>'+minS+'</td><td>'+minD+'</td></tr>';
h+='<tr><td>Average</td><td style="font-weight:700;">'+Math.round(totS/entries.length)+'</td><td style="font-weight:700;">'+Math.round(totD/entries.length)+'</td></tr></table>';
var days={};entries.forEach(function(e){if(!days[e.date])days[e.date]={sys:[],dia:[]};days[e.date].sys.push(e.sys);days[e.date].dia.push(e.dia);});
var dayKeys=Object.keys(days).sort();
if(dayKeys.length>2){var avgSys=[],avgW=[],avgSt=[];
dayKeys.forEach(function(d){var ds=days[d];avgSys.push(ds.sys.reduce(function(a,b){return a+b;},0)/ds.sys.length);
var w=0;(DATA.water||[]).forEach(function(e){if(e.date===d)w+=e.oz;});avgW.push(w);
var s=0;(DATA.steps||[]).forEach(function(e){if(e.date===d)s+=e.count;});s+=(DATA.appleSteps&&DATA.appleSteps[d])||0;avgSt.push(s);});
function corr(a,b){var n=a.length;if(n<3)return 0;var ma=a.reduce(function(x,y){return x+y;},0)/n;var mb=b.reduce(function(x,y){return x+y;},0)/n;
var num=0,da=0,db=0;for(var i=0;i<n;i++){num+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)*(a[i]-ma);db+=(b[i]-mb)*(b[i]-mb);}
return da&&db?num/Math.sqrt(da*db):0;}
function corrLabel(r){var a=Math.abs(r);if(a>.7)return 'Strong';if(a>.4)return 'Moderate';if(a>.2)return 'Weak';return 'None';}
var r1=corr(avgSys,avgW),r2=corr(avgSys,avgSt);
h+='<h3 style="margin-top:12px;">Correlations</h3>';
h+='<p style="font-size:.85rem;">BP ↔ Water: <b>'+r1.toFixed(2)+'</b> ('+corrLabel(r1)+')</p>';
h+='<p style="font-size:.85rem;">BP ↔ Steps: <b>'+r2.toFixed(2)+'</b> ('+corrLabel(r2)+')</p>';}
h+='</div>';document.getElementById('analysisResult').innerHTML=h;}catch(e){}}
